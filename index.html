    let currentQuestions = [];
    let userAnswers = {};
    let isGraded = false;

    // Thuật toán xáo trộn Fisher-Yates
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Khởi tạo bài kiểm tra
    function initQuiz() {
      const mode = document.getElementById('mode-select').value;
      let pool = [];

      if (mode === 'all') {
        pool = [...rawQuestionsData];
      } else {
        // Mặc định: random20 (lấy 20 câu ngẫu nhiên từ toàn bộ ngân hàng)
        const allShuffled = shuffleArray(rawQuestionsData);
        pool = allShuffled.slice(0, 20);
      }

      // Xáo trộn thứ tự các câu hỏi
      const shuffledQ = shuffleArray(pool);

      // Xáo trộn các đáp án trong từng câu
      currentQuestions = shuffledQ.map((qItem, index) => {
        return {
          id: index + 1,
          lesson: qItem.lesson,
          question: qItem.q,
          options: shuffleArray(qItem.options)
        };
      });

      userAnswers = {};
      isGraded = false;
      renderQuiz();
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      const alphabet = ['A', 'B', 'C', 'D'];

      currentQuestions.forEach((item, qIdx) => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200 transition duration-200';
        card.id = `card-q-${qIdx}`;

        // Badge phân loại bài học
        let lessonBadgeColor = 'bg-slate-100 text-slate-800';
        if (item.lesson === 'Bài 1') lessonBadgeColor = 'bg-emerald-100 text-emerald-800';
        if (item.lesson === 'Bài 2') lessonBadgeColor = 'bg-red-100 text-red-800';
        if (item.lesson === 'Bài 3') lessonBadgeColor = 'bg-blue-100 text-blue-800';
        if (item.lesson === 'Bài 4') lessonBadgeColor = 'bg-amber-100 text-amber-800';
        if (item.lesson === 'Bài 5') lessonBadgeColor = 'bg-purple-100 text-purple-800';
        if (item.lesson === 'Bài 6') lessonBadgeColor = 'bg-teal-100 text-teal-800';

        const title = document.createElement('h3');
        title.className = 'font-bold text-slate-800 text-base md:text-lg mb-4 flex items-start gap-2';
        title.innerHTML = `
          <div class="flex items-center gap-1.5 shrink-0 mt-0.5">
            <span class="bg-slate-200 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded">Câu ${qIdx + 1}</span>
            <span class="${lessonBadgeColor} text-xs font-semibold px-2 py-0.5 rounded whitespace-nowrap">${item.lesson}</span>
          </div>
          <span>${item.question}</span>
        `;
        card.appendChild(title);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'grid grid-cols-1 gap-2.5';

        item.options.forEach((opt, optIdx) => {
          const label = document.createElement('label');
          label.className = 'option-label border border-slate-200 rounded-lg p-3 md:p-3.5 flex items-start gap-3 cursor-pointer hover:bg-slate-50 transition duration-150 text-sm md:text-base';
          label.id = `opt-label-${qIdx}-${optIdx}`;

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `question-${qIdx}`;
          radio.value = optIdx;
          radio.className = 'mt-1 text-red-700 focus:ring-red-600';

          radio.addEventListener('change', () => {
            if (!isGraded) {
              userAnswers[qIdx] = optIdx;
              highlightOption(qIdx);
              updateProgress();
            }
          });

          const textSpan = document.createElement('div');
          textSpan.className = 'flex-1 text-slate-700';
          textSpan.textContent = `${alphabet[optIdx]}. ${opt.text}`;

          label.appendChild(radio);
          label.appendChild(textSpan);
          optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);

        const feedback = document.createElement('div');
        feedback.id = `feedback-${qIdx}`;
        feedback.className = 'mt-3 hidden text-xs md:text-sm font-medium p-2.5 rounded-lg';
        card.appendChild(feedback);

        container.appendChild(card);
      });
    }

    function highlightOption(qIdx) {
      const card = document.getElementById(`card-q-${qIdx}`);
      const labels = card.querySelectorAll('.option-label');
      labels.forEach((lbl, idx) => {
        if (idx === userAnswers[qIdx]) {
          lbl.classList.add('bg-red-50', 'border-red-300', 'text-red-900');
        } else {
          lbl.classList.remove('bg-red-50', 'border-red-300', 'text-red-900');
        }
      });
    }

    function updateProgress() {
      const answered = Object.keys(userAnswers).length;
      const total = currentQuestions.length;
      document.getElementById('answered-counter').textContent = `${answered}/${total}`;
      const percent = total > 0 ? (answered / total) * 100 : 0;
      document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    // Chấm điểm bài kiểm tra
    function gradeQuiz() {
      if (isGraded) {
        alert('Bạn đã nộp bài rồi! Hãy bấm "Trộn đề mới & Làm lại" để bắt đầu lượt mới.');
        return;
      }

      const total = currentQuestions.length;
      const answered = Object.keys(userAnswers).length;

      if (answered < total) {
        if (!confirm(`Bạn mới trả lời ${answered}/${total} câu. Bạn có chắc chắn muốn nộp bài sớm?`)) {
          return;
        }
      }

      isGraded = true;
      let correctAnswersCount = 0;

      currentQuestions.forEach((qItem, qIdx) => {
        const selectedOptIdx = userAnswers[qIdx];
        const correctOptIdx = qItem.options.findIndex(o => o.correct === true);
        const card = document.getElementById(`card-q-${qIdx}`);
        const feedback = document.getElementById(`feedback-${qIdx}`);
        feedback.classList.remove('hidden');

        // Khóa các ô radio
        const inputs = card.querySelectorAll('input[type="radio"]');
        inputs.forEach(input => input.disabled = true);

        // Đổi màu đáp án chính xác
        const correctLabel = document.getElementById(`opt-label-${qIdx}-${correctOptIdx}`);
        correctLabel.classList.remove('border-slate-200', 'bg-red-50', 'border-red-300');
        correctLabel.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'font-medium');

        if (selectedOptIdx === correctOptIdx) {
          correctAnswersCount++;
          card.classList.add('border-emerald-300');
          feedback.classList.add('bg-emerald-100', 'text-emerald-800');
          feedback.innerHTML = `<i class="fa-solid fa-circle-check mr-1.5"></i> Chính xác!`;
        } else {
          card.classList.add('border-rose-300');
          feedback.classList.add('bg-rose-100', 'text-rose-800');
          if (selectedOptIdx !== undefined) {
            const wrongLabel = document.getElementById(`opt-label-${qIdx}-${selectedOptIdx}`);
            wrongLabel.classList.remove('bg-red-50', 'border-red-300');
            wrongLabel.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900', 'line-through');
            feedback.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1.5"></i> Chưa chính xác. Đáp án đúng là đáp án màu xanh.`;
          } else {
            feedback.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Bạn chưa chọn đáp án cho câu này.`;
          }
        }
      });

      showResultModal(correctAnswersCount, total);
    }

    function showResultModal(correct, total) {
      const score10 = ((correct / total) * 10).toFixed(1);
      document.getElementById('correct-count').textContent = `${correct}/${total}`;
      document.getElementById('score-10').textContent = score10;

      const badge = document.getElementById('result-badge');
      const title = document.getElementById('result-title');
      const feedback = document.getElementById('result-feedback');

      if (score10 >= 8.5) {
        badge.className = 'w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-bold bg-emerald-100 text-emerald-600';
        badge.innerHTML = '<i class="fa-solid fa-trophy"></i>';
        title.textContent = "Xuất sắc!";
        feedback.textContent = "Bạn đã nắm rất vững kiến thức các bài học!";
      } else if (score10 >= 6.5) {
        badge.className = 'w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-bold bg-blue-100 text-blue-800';
        badge.innerHTML = '<i class="fa-solid fa-star"></i>';
        title.textContent = "Khá tốt!";
        feedback.textContent = "Hãy ôn lại các câu trả lời chưa đúng để chuẩn bị thi thật tốt nhé.";
      } else {
        badge.className = 'w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-bold bg-rose-100 text-rose-600';
        badge.innerHTML = '<i class="fa-solid fa-book-open"></i>';
        title.textContent = "Cần cố gắng!";
        feedback.textContent = "Hãy xem lại đáp án và luyện tập thêm một vài lượt nhé.";
      }

      document.getElementById('result-modal').classList.remove('hidden');
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initQuiz();
    });
  </script>
</body>
</html>
